# Netlify deployment config.
# Works with a private GitHub repo on the free tier.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Matches the "engines" field in package.json.
  NODE_VERSION = "22"

# SPA fallback: vue-router uses history mode, so unknown paths must be
# served index.html rather than a 404 from the CDN.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The resume is replaced in place, so let it revalidate.
[[headers]]
  for = "/resume/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

